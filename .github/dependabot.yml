version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /mobile
    schedule: { interval: weekly }
    groups:
      dart:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
