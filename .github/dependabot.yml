version: 2

# Aktualizacje major (i Python 3.15) nie przychodzą automatycznie — robimy je świadomie,
# po przeczytaniu changeloga (zarys, sekcja 10: „Nowe wersje w trakcie semestru”).
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directory: /mobile
    schedule: { interval: weekly }
    groups:
      dart:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # mobile/packages/api_client is generated: scripts/gen-api-client.sh sets its codegen
      # dependencies to `any`; a pinned version there breaks the "Kontrakt API" check.
      - dependency-name: build_runner

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      # Zostajemy na Pythonie 3.14 do końca semestru.
      - dependency-name: python
        versions: [">=3.15"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Akcje GitHuba: także major (zmiany zwykle tylko w środowisku uruchomieniowym akcji).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
