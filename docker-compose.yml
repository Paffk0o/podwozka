# Lokalne środowisko: docker compose up -d
# Reset wszystkiego (baza + ponowny import realmu Keycloaka): docker compose down -v

name: podwozka

# One backend image (API, migrations + seed, Celery worker and beat), built once.
x-backend: &backend
  build: ./backend
  image: podwozka-backend:local
  environment:
    ENVIRONMENT: local
    DATABASE_URL: postgresql+asyncpg://podwozka:podwozka@db:5432/podwozka
    REDIS_URL: redis://redis:6379/0
    OIDC_ISSUER: http://localhost:8080/realms/podwozka
    OIDC_JWKS_URL: http://keycloak:8080/realms/podwozka/protocol/openid-connect/certs
    # dev-cli: tylko lokalnie, do pobierania tokenów curl/Swagger (password grant).
    OIDC_ALLOWED_CLIENTS: '["passenger-app","driver-app","admin-panel","dev-cli"]'
    # Keycloak Admin API (service account podwozka-backend; dev secret from the local realm).
    KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    KEYCLOAK_BACKEND_CLIENT_SECRET: ${KEYCLOAK_BACKEND_CLIENT_SECRET:-dev-backend-secret}
    # Azurite's public, documented development account (not a secret). SAS links handed to the
    # apps use the public address; emulator/phone: `adb reverse tcp:10000 tcp:10000`.
    AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
    AZURE_STORAGE_PUBLIC_URL: http://localhost:10000/devstoreaccount1
    GOOGLE_MAPS_SERVER_KEY: ${GOOGLE_MAPS_SERVER_KEY:-}
    NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-Podwozka-backend/1.0}
    # Push (FCM): put the Firebase service-account JSON in ./secrets/ (git-ignored) and set
    # FIREBASE_CREDENTIALS_FILE=/run/secrets/firebase-service-account.json in .env.
    FIREBASE_CREDENTIALS_FILE: ${FIREBASE_CREDENTIALS_FILE:-}
    STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    SENTRY_DSN: ${SENTRY_DSN:-}

services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: podwozka
      POSTGRES_PASSWORD: podwozka
      POSTGRES_DB: podwozka
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podwozka -d podwozka"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-2
    # start-dev: tylko lokalnie. Na Azure obraz budowany z `kc.sh build` i start --optimized.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: podwozka
      KC_DB_PASSWORD: podwozka
      # Stały adres w tokenach (claim `iss`). Telefony/emulatory: `adb reverse tcp:8080 tcp:8080`.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    volumes:
      - ./infra/keycloak/realm-podwozka.json:/opt/keycloak/data/import/realm-podwozka.json:ro
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # Obraz Keycloaka nie ma curla — sprawdzamy /health/ready przez /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports: ["8025:8025", "1025:1025"]

  # Azure Storage emulator: driver documents (same code as Azure Blob Storage on staging).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000", "--location", "/data", "--skipApiVersionCheck"]
    ports: ["10000:10000"]
    volumes:
      - azurite:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs once on every `docker compose up`: migrations, then demo data (idempotent: two
  # municipalities with tariffs; repeated runs change nothing).
  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *backend
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      azurite: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    develop:
      # `docker compose watch` — przeładowanie po zmianie kodu
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/app
        - action: rebuild
          path: ./backend/uv.lock

  # Celery: offer timeouts (20 s), sweeper, reservations, push.
  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=info", "--concurrency=2"]
    volumes:
      # Optional FCM key: secrets/firebase-service-account.json (see secrets/README.md).
      - ./secrets:/run/secrets:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    develop:
      watch:
        - action: sync+restart
          path: ./backend/app
          target: /app/app

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  azurite:
