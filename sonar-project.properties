# SonarQube Cloud — uzupełnij po utworzeniu projektu na sonarcloud.io (Agent DevOps).
sonar.organization=TODO-organizacja
sonar.projectKey=TODO-organizacja_podwozka
sonar.projectName=Podwózka

sonar.sources=backend/app,mobile/packages/core/lib,mobile/apps/passenger/lib,mobile/apps/driver/lib
sonar.tests=backend/tests,mobile/packages/core/test,mobile/apps/passenger/test,mobile/apps/driver/test
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,mobile/packages/api_client/**,backend/migrations/**

sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.dart.lcov.reportPaths=mobile/packages/core/coverage/lcov.info,mobile/apps/passenger/coverage/lcov.info,mobile/apps/driver/coverage/lcov.info

# Krok CI kończy się błędem, jeśli Quality Gate nie przejdzie → merge zablokowany.
sonar.qualitygate.wait=true
sonar.sourceEncoding=UTF-8
